services:
  db:
    image: postgres:16-alpine
    container_name: merch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - merch_pgdata_v2:/var/lib/postgresql/data
    networks:
      - merch_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merch-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_TO_INTERNAL: ${RESEND_TO_INTERNAL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      ADMIN_SECRET: ${ADMIN_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - merch_net
      - coolify
    labels:
      # Traefik routing — dominio nuevo principal: merchandising.hubstartidea.es
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.startidea-merch.rule: "Host(`merchandising.hubstartidea.es`)"
      traefik.http.routers.startidea-merch.entrypoints: websecure
      traefik.http.routers.startidea-merch.tls: "true"
      traefik.http.routers.startidea-merch.tls.certresolver: letsencrypt
      traefik.http.routers.startidea-merch.service: startidea-merch
      traefik.http.routers.startidea-merch-http.rule: "Host(`merchandising.hubstartidea.es`)"
      traefik.http.routers.startidea-merch-http.entrypoints: web
      traefik.http.routers.startidea-merch-http.middlewares: startidea-merch-redirect
      # Router legacy para merchandising.startidea.es — quitar cuando se actualice DNS en IONOS
      traefik.http.routers.startidea-merch-old.rule: "Host(`merchandising.startidea.es`)"
      traefik.http.routers.startidea-merch-old.entrypoints: websecure
      traefik.http.routers.startidea-merch-old.tls: "true"
      traefik.http.routers.startidea-merch-old.tls.certresolver: letsencrypt
      traefik.http.routers.startidea-merch-old.service: startidea-merch
      traefik.http.routers.startidea-merch-old-http.rule: "Host(`merchandising.startidea.es`)"
      traefik.http.routers.startidea-merch-old-http.entrypoints: web
      traefik.http.routers.startidea-merch-old-http.middlewares: startidea-merch-redirect
      traefik.http.middlewares.startidea-merch-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.startidea-merch-redirect.redirectscheme.permanent: "true"
      traefik.http.services.startidea-merch.loadbalancer.server.port: "3000"

networks:
  merch_net:
    driver: bridge
  coolify:
    external: true

volumes:
  merch_pgdata_v2:
