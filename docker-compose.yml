services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-merch}
    volumes:
      - merch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-merch} -d ${POSTGRES_DB:-merch}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-merch}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-merch}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_TO_INTERNAL: ${RESEND_TO_INTERNAL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      ADMIN_SECRET: ${ADMIN_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    labels:
      coolify.managed: "true"
      # Coolify Traefik labels se generan automáticamente desde la UI cuando
      # se configura el dominio en la Application.

volumes:
  merch_pgdata:
