services:
  db:
    image: postgres:16-alpine
    container_name: merch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - merch_pgdata_v2:/var/lib/postgresql/data
    networks:
      - merch_net

  # Buscador del catálogo (erratas + relevancia). SOLO red interna: sin
  # labels Traefik ni puertos publicados — la web habla con él vía
  # http://merch-meili:7700 y toda búsqueda pública pasa por nuestras APIs.
  meili:
    image: getmeili/meilisearch:v1.51
    container_name: merch-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - merch_meili:/meili_data
    networks:
      - merch_net

  # Eliminación de fondo de logos (rembg, modo servidor). SOLO red interna;
  # la app le habla vía http://merch-rembg:7000 con fallback si está caído.
  # mem_limit protege el VPS: la inferencia U2Net en CPU puede picar RAM.
  rembg:
    image: danielgatis/rembg:2.0.77
    container_name: merch-rembg
    restart: unless-stopped
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    mem_limit: 1500m
    volumes:
      - merch_rembg_models:/root/.u2net
    networks:
      - merch_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merch-app
    restart: unless-stopped
    depends_on:
      - db
    # env_file carga TODAS las vars de .env automáticamente. Las vars listadas
    # en `environment:` siguen aplicando — son redundancia explícita para las
    # críticas. Cualquier var nueva que añadas solo al .env (sin tocar este
    # compose) llegará al container sin recrear nada. Resolvió el problema
    # crónico de vars que se "perdían" en cada deploy.
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_TO_INTERNAL: ${RESEND_TO_INTERNAL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID}
      NEXT_PUBLIC_GSC_VERIFICATION: ${NEXT_PUBLIC_GSC_VERIFICATION}
      ADMIN_SECRET: ${ADMIN_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_TEAM_CHAT_ID: ${TELEGRAM_TEAM_CHAT_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      MIDOCEAN_API_KEY: ${MIDOCEAN_API_KEY}
      MIDOCEAN_API_BASE: ${MIDOCEAN_API_BASE:-https://api.midocean.com}
      MIDOCEAN_LIVE_ORDERS: ${MIDOCEAN_LIVE_ORDERS:-false}
      MIDOCEAN_AUTO_PLACE_ON_PAYMENT: "${MIDOCEAN_AUTO_PLACE_ON_PAYMENT:-true}"
      MIDOCEAN_CUSTOMER_NUMBER: ${MIDOCEAN_CUSTOMER_NUMBER}
      # Cifra API (cifra.es / api.cifrashop.com) — token UUID en path
      CIFRA_API_TOKEN: ${CIFRA_API_TOKEN}
      CIFRA_API_BASE: ${CIFRA_API_BASE:-https://api.cifrashop.com}
      CIFRA_LANG: ${CIFRA_LANG:-es}
      # Auto-place del pedido a Cifra tras pago Stripe. Default true.
      # CIFRA_LIVE_ORDERS=true (no default) confirma envío REAL a Cifra.
      # false (default) = dry run, guarda payload en PO.internalNotes sin
      # llegar a Cifra. Útil para validar antes de activar producción real.
      CIFRA_AUTO_PLACE_ON_PAYMENT: ${CIFRA_AUTO_PLACE_ON_PAYMENT:-true}
      CIFRA_LIVE_ORDERS: ${CIFRA_LIVE_ORDERS:-false}
      # Makito API (data.makito.es/api) — Bearer token Sanctum tras login
      MAKITO_API_BASE: ${MAKITO_API_BASE:-https://data.makito.es/api}
      MAKITO_API_EMAIL: ${MAKITO_API_EMAIL}
      MAKITO_API_PASSWORD: ${MAKITO_API_PASSWORD}
      # Makito feeds XML (print.makito.es/user/xml/*) — token UUID en query
      MAKITO_FEED_BASE: ${MAKITO_FEED_BASE:-https://print.makito.es/user/xml}
      MAKITO_FEED_TOKEN: ${MAKITO_FEED_TOKEN}
      # Makito no expone POST de orders en su API. Auto-order envía email
      # a admin (Mario) con el desglose; el pedido al proveedor se hace
      # manualmente (mismo workflow legacy de B2B Makito).
      MAKITO_AUTO_PLACE_ON_PAYMENT: ${MAKITO_AUTO_PLACE_ON_PAYMENT:-true}
      MARGIN_MULTIPLIER: ${MARGIN_MULTIPLIER:-1.6667}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hola@merchandising.startidea.es}
      # Voice agent (ElevenLabs Conversational AI · Carmen)
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID}
      ELEVENLABS_AGENT_NAME: ${ELEVENLABS_AGENT_NAME:-Diego}
      VOICE_AGENT_TOOL_SECRET: ${VOICE_AGENT_TOOL_SECRET}
      # OpenAI key (heredada del hub — usada para embeddings semánticos via
      # LlamaIndex.ts y, futuro, improve-descriptions con GPT-4o-mini)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STRIPE_TAX_ENABLED: ${STRIPE_TAX_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      # SEO automation — Google Indexing API + IndexNow (Bing/Yandex/DDG)
      GOOGLE_INDEXING_CLIENT_EMAIL: ${GOOGLE_INDEXING_CLIENT_EMAIL}
      GOOGLE_INDEXING_PRIVATE_KEY: ${GOOGLE_INDEXING_PRIVATE_KEY}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      NODE_ENV: production
      PORT: "3000"
      # Forzar bind a 0.0.0.0 — sin esto Next.js standalone escucha solo
      # en el hostname interno del container y el healthcheck localhost falla.
      HOSTNAME: "0.0.0.0"
      # Directorio persistente para uploads (customer-logos, magnific-assets, etc).
      # Montado en /app/uploads vía volumen Docker (sobrevive redeploys).
      UPLOADS_DIR: /app/uploads
    expose:
      - "3000"
    volumes:
      # Persistencia de archivos subidos por usuarios (logos clientes para
      # personalización + imágenes generadas por Magnific). Sin este volume
      # los uploads se pierden en cada rebuild del contenedor.
      - merch_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - merch_net
      - coolify
    labels:
      # Traefik routing — dominio nuevo principal: merchandising.startidea.es
      traefik.enable: "true"
      traefik.docker.network: coolify
      # Dominio canónico: merchandising.startidea.es. El host viejo
      # (merchandising.hubstartidea.es) responde 301 SALVO /api/, que sigue
      # sirviendo directo: integraciones máquina-a-máquina (Telegram, tools de
      # ElevenLabs, enlaces de email antiguos a /api/m/) pueden tener la URL
      # vieja configurada y no todos los clientes siguen redirects en POST.
      traefik.http.routers.startidea-merch.rule: "Host(`merchandising.startidea.es`)"
      traefik.http.routers.startidea-merch.entrypoints: websecure
      traefik.http.routers.startidea-merch.tls: "true"
      traefik.http.routers.startidea-merch.tls.certresolver: letsencrypt
      traefik.http.routers.startidea-merch.service: startidea-merch
      # host viejo, /api → sirve directo (prioridad explícita sobre el 301)
      traefik.http.routers.startidea-merch-oldapi.rule: "Host(`merchandising.hubstartidea.es`) && PathPrefix(`/api`)"
      traefik.http.routers.startidea-merch-oldapi.entrypoints: websecure
      traefik.http.routers.startidea-merch-oldapi.tls: "true"
      traefik.http.routers.startidea-merch-oldapi.tls.certresolver: letsencrypt
      traefik.http.routers.startidea-merch-oldapi.service: startidea-merch
      traefik.http.routers.startidea-merch-oldapi.priority: "100"
      # host viejo, resto → 301 al canónico conservando la ruta
      traefik.http.routers.startidea-merch-old.rule: "Host(`merchandising.hubstartidea.es`)"
      traefik.http.routers.startidea-merch-old.entrypoints: websecure
      traefik.http.routers.startidea-merch-old.tls: "true"
      traefik.http.routers.startidea-merch-old.tls.certresolver: letsencrypt
      traefik.http.routers.startidea-merch-old.service: startidea-merch
      traefik.http.routers.startidea-merch-old.priority: "50"
      traefik.http.routers.startidea-merch-old.middlewares: startidea-merch-domain301
      traefik.http.middlewares.startidea-merch-domain301.redirectregex.regex: "^https://merchandising\\.hubstartidea\\.es/(.*)"
      traefik.http.middlewares.startidea-merch-domain301.redirectregex.replacement: "https://merchandising.startidea.es/$${1}"
      traefik.http.middlewares.startidea-merch-domain301.redirectregex.permanent: "true"
      traefik.http.routers.startidea-merch-http.rule: "Host(`merchandising.hubstartidea.es`) || Host(`merchandising.startidea.es`)"
      traefik.http.routers.startidea-merch-http.entrypoints: web
      traefik.http.routers.startidea-merch-http.middlewares: startidea-merch-redirect
      traefik.http.middlewares.startidea-merch-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.startidea-merch-redirect.redirectscheme.permanent: "true"
      traefik.http.services.startidea-merch.loadbalancer.server.port: "3000"

networks:
  merch_net:
    driver: bridge
  coolify:
    external: true

volumes:
  merch_pgdata_v2:
  merch_uploads:
  merch_meili:
  merch_rembg_models:
