name: Money smoke test (invariantes de dinero/proveedor)

# Guardián de las reglas de NEGOCIO en producción: que el marcaje se cobre
# (regresión del P0 2026-07-15) y que NUNCA se filtre un proveedor en
# respuestas públicas (regla nº1). Solo lecturas públicas, sin secretos de app.
# Si algo se rompe: el job falla (GitHub avisa) + alerta a Telegram.

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6h, minuto 17 para no chocar con otros crons
  workflow_dispatch: {}

concurrency:
  group: money-smoke
  # NO se mata el run en curso: un barrido dura menos de 4 min y estos corren
  # cada 6 h, así que encolar es gratis. Matarlo dejaba un "cancelled" mudo
  # (ver abajo por qué eso es justo lo que no puede pasar en este guard).
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Holgado A PROPÓSITO: el script se autolimita con SMOKE_BUDGET_MS (4 min)
    # y tiene que ser ÉL quien decida el resultado. El 2026-08-05 03:32 UTC este
    # job se quedó CANCELADO al tocar el `timeout-minutes: 3` que había antes:
    # un job cancelado no dispara `if: failure()`, así que no salió ninguna
    # alerta y el run quedó como "cancelled", que se lee como algo manual.
    # El guard del dinero y de la fuga de proveedor murió en silencio.
    #
    # 12 y no 8 desde el 2026-08-18: un fallo de PURA disponibilidad se
    # confirma ahora con un segundo barrido (ver RETRY_DELAY_MS en el script),
    # así que el peor caso pasa a ser 240 s + 45 s de espera + 240 s ≈ 8m45.
    # Con 8 el job habría muerto CANCELADO justo en ese caso, que es el modo
    # de fallo mudo descrito arriba. El guard estático del test comprueba que
    # este número sigue por encima del peor caso del script.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Ejecutar money smoke test
        id: smoke
        run: node scripts/money-smoke-test.mjs
      # El texto lo redacta el propio script (steps.smoke.outputs.alert_text) para
      # que distinga "una invariante de dinero se ha roto" de "una superficie no
      # respondió y no se ha podido comprobar". El job falla igual en los dos
      # casos: lo que no puede es AFIRMAR una rotura que no consta. Si el script
      # se cayó antes de escribir el output, se usa el texto genérico.
      - name: Alerta Telegram si falla
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEXT: ${{ steps.smoke.outputs.alert_text }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::Sin secrets Telegram — no se envía alerta"
            exit 0
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -z "$ALERT_TEXT" ]; then
            ALERT_TEXT="🚨 MONEY SMOKE FALLÓ (el guard no llegó a clasificar el fallo) — revisar YA: ${RUN_URL}"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${ALERT_TEXT}" \
            > /dev/null || echo "::warning::No se pudo avisar por Telegram"

      # Red de seguridad para el modo de fallo que nos mordió: si el job se
      # cancela (timeout del job, cancelación manual o caída del runner), el
      # paso de arriba NO corre. Sin esto, el guard se apaga sin decir nada.
      - name: Avisar si el guard NI SIQUIERA llegó a comprobar
        if: cancelled()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::Sin secrets Telegram — no se envía alerta"
            exit 0
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ MONEY SMOKE CANCELADO — el guard no llegó a comprobar NADA (ninguna invariante rota confirmada, pero tampoco ninguna verificada). Revisar por qué se cortó: ${RUN_URL}" \
            > /dev/null || echo "::warning::No se pudo avisar por Telegram"
