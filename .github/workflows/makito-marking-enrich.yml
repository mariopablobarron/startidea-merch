name: Makito marking enrich diario

# Diario 02:15 UTC, después de makito-sync (01:00). Enriquece datos
# de marcaje desde la API legacy de Makito.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: makito-marking-enrich
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar makito-marking-enrich
        env:
          CRON_SECRET: ${{ secrets.MERCH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta secret MERCH_CRON_SECRET"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://merchandising.hubstartidea.es/api/cron/makito-marking-enrich" \
            -H "x-cron-secret: $CRON_SECRET")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            echo "::error::makito-marking-enrich devolvió $code"
            exit 1
          fi
