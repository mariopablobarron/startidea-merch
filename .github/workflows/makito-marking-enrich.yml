name: Makito marking enrich diario

# Diario 02:15 UTC, después de makito-sync (01:00). Enriquece datos
# de marcaje desde la API legacy de Makito.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: makito-marking-enrich
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar makito-marking-enrich
        uses: ./.github/actions/cron-trigger
        with:
          name: makito-marking-enrich
          url: https://merchandising.startidea.es/api/cron/makito-marking-enrich
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200 202"
