# Cron diario: mantenimiento de ProductView.
# - Resetea contadores 30d para productos sin actividad reciente
# - Limpia entries de productos desactivados
#
# Programado 03:30 UTC todos los días (después de los syncs de proveedores).
# Permite también disparo manual desde GitHub Actions UI.

name: ProductView rollup diario

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: productview-rollup
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar rollup
        uses: ./.github/actions/cron-trigger
        with:
          name: product-view-rollup
          url: https://merchandising.startidea.es/api/cron/product-view-rollup
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
