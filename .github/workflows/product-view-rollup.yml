# Cron diario: mantenimiento de ProductView.
# - Resetea contadores 30d para productos sin actividad reciente
# - Limpia entries de productos desactivados
#
# Programado 03:30 UTC todos los días (después de los syncs de proveedores).
# Permite también disparo manual desde GitHub Actions UI.

name: ProductView rollup diario

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: productview-rollup
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar rollup
        env:
          CRON_SECRET: ${{ secrets.MERCH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta secret MERCH_CRON_SECRET"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://merchandising.hubstartidea.es/api/cron/product-view-rollup" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Rollup devolvió $code"
            exit 1
          fi
