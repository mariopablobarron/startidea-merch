name: AI usage alert diaria

# Diario 10:00 UTC (11:00 Madrid invierno, 12:00 verano).
# Computa coste IA del día anterior. Si supera umbral, push admin.
# Anti-spam: solo alerta si día -2 no pasó (evita ruido consecutivo).

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: ai-usage-alert
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar alerta gasto IA
        uses: ./.github/actions/cron-trigger
        with:
          name: ai-usage-alert
          url: https://merchandising.startidea.es/api/cron/ai-usage-alert
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
