name: Insights monthly digest

# Día 1 de cada mes a las 09:00 UTC (10:00 Madrid en invierno CET, 11:00 verano CEST).
# Comparativa "mes pasado vs mes anterior" por email.

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

concurrency:
  group: insights-digest-monthly
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar digest mensual
        uses: ./.github/actions/cron-trigger
        with:
          name: insights-digest-monthly
          url: https://merchandising.startidea.es/api/cron/insights-digest-monthly
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
