name: Cron watchdog diario

# Diario 11:00 UTC. Recorre todos los crons trackeados con
# wrapCronHandler y avisa si alguno lleva mucho sin ejecutarse o
# tuvo fallo en su última run.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar cron watchdog
        uses: ./.github/actions/cron-trigger
        with:
          name: cron-watchdog
          url: https://merchandising.startidea.es/api/cron/cron-watchdog
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
