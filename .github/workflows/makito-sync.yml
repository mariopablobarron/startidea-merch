name: Makito sync diario

# Diario 01:00 UTC. Sync catálogo legacy (XML feeds) Makito → BD.
# Sync masivo: ~5-10 min en background.

# El disparo diario lo hace el crontab del VPS (merch-cron-runner.sh, 06:00
# hora Madrid = 04:00 UTC), que es más robusto: guardas de arranque/carga/docker
# + aviso Telegram solo en fallo real. Se retiró el schedule de GitHub Actions
# porque duplicaba el sync y, por el retraso de GH, chocaba con el crontab → el
# cron-lock devolvía 409 (falsos "fallos"). Queda workflow_dispatch para lanzarlo
# a mano desde la pestaña Actions.
on:
  workflow_dispatch: {}

concurrency:
  group: makito-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar makito-sync
        uses: ./.github/actions/cron-trigger
        with:
          name: makito-sync
          url: https://merchandising.startidea.es/api/cron/makito-sync
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200 202"
