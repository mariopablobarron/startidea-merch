name: Deploy — nota (el deploy real es por PULL desde el VPS)

# Este workflow NO despliega. El deploy de merch se hace por PULL desde el VPS
# (migrado en fe69867): /root/startidea-merch-autodeploy.sh corre cada minuto,
# detecta el commit nuevo vía la API de GitHub y ejecuta scripts/deploy.sh
# (build con cache-bust por GIT_SHA + verificación de que el contenedor corre la
# imagen recién construida). El SSH ENTRANTE desde los runners de GitHub está
# baneado por fail2ban, así que el antiguo deploy por SSH ya no es viable — daba
# ROJO en cada push (ruido que llegó a confundir un diagnóstico el 2026-07-21).
#
# Verificar un deploy concreto (no fiarse del marcador ni de "container Up"):
#   ssh root@VPS 'docker exec merch-app printenv GIT_SHA'   # == commit desplegado

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch: {}

jobs:
  nota:
    name: El deploy real es por pull desde el VPS (no por este workflow)
    runs-on: ubuntu-latest
    steps:
      - name: Explicación
        run: |
          echo "Este workflow NO despliega merch."
          echo "Deploy real = PULL desde el VPS: /root/startidea-merch-autodeploy.sh (cada minuto)."
          echo "El SSH entrante desde runners está baneado por fail2ban (por eso se migró al pull)."
          echo "Verificar: docker exec merch-app printenv GIT_SHA  debe == el commit desplegado."
