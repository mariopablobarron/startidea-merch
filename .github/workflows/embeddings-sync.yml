name: Embeddings sync diario

# Diario 05:00 UTC, después de TODOS los syncs de proveedores (01:00-03:00).
# Genera embeddings de productos nuevos/modificados para búsqueda semántica
# del recomendador IA.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: embeddings-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar embeddings-sync
        uses: ./.github/actions/cron-trigger
        with:
          name: embeddings-sync
          url: https://merchandising.startidea.es/api/cron/embeddings-sync
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200 202"
