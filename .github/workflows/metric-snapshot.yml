name: Metric snapshot diario

# Guarda KPIs del día en MetricSnapshot para gráficas históricas.
#
# ⚠️ YA NO LO PROGRAMA GITHUB. El disparador es el crontab del VPS
# (06:50 local = 04:50 UTC), 10 min después del `product-view-rollup`, porque
# lee los contadores rodantes que ese rollup deja. Ver el porqué completo en
# .github/workflows/product-view-rollup.yml: GitHub entregaba los dos con
# horas de retraso y el orden entre ellos dejó de estar garantizado.
#
# Se conserva el `workflow_dispatch` a propósito: el 01-sep el disparo falló
# (la petición no salió del runner), la fila del día se perdió y no era
# reconstruible — la única recuperación posible es volver a dispararlo el
# mismo día.

on:
  workflow_dispatch: {}

concurrency:
  group: metric-snapshot
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar snapshot
        uses: ./.github/actions/cron-trigger
        with:
          name: metric-snapshot
          url: https://merchandising.startidea.es/api/cron/metric-snapshot
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
