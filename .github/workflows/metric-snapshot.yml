name: Metric snapshot diario

# 03:35 UTC todos los días (5 min después del rollup ProductView).
# Guarda KPIs del día en MetricSnapshot para gráficas históricas.

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: metric-snapshot
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar snapshot
        uses: ./.github/actions/cron-trigger
        with:
          name: metric-snapshot
          url: https://merchandising.startidea.es/api/cron/metric-snapshot
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
