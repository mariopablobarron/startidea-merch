name: Cifra sync diario

# Diario 02:30 UTC (03:30 Madrid invierno, 04:30 verano).
# Antes del rollup (03:00) y metric-snapshot (03:35).
#
# Sincroniza catálogo + stock + precios Cifra → BD local.
# El sync es fire-and-forget; el endpoint vuelve en 200 ms con
# 202 Accepted y persiste resultado en SupplierSync.
#
# Si vuelve a fallar de forma silenciosa, el cron-watchdog avisa
# (porque cifra-sync ya pasa por wrapCronHandler).

# El disparo diario lo hace el crontab del VPS (merch-cron-runner.sh, 05:00
# hora Madrid = 03:00 UTC), más robusto (guardas de arranque/carga/docker +
# Telegram solo en fallo real). Se retiró el schedule de GitHub Actions para no
# duplicar el sync ni chocar con el crontab (409 del cron-lock). Queda
# workflow_dispatch para lanzarlo a mano.
on:
  workflow_dispatch: {}

concurrency:
  group: cifra-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar cifra-sync
        uses: ./.github/actions/cron-trigger
        with:
          name: cifra-sync
          url: https://merchandising.startidea.es/api/cron/cifra-sync
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200 202"
