name: MidOcean sync diario

# Diario 01:30 UTC. Sync productos + stock + precios MidOcean → BD.
# Fire-and-forget en el endpoint (200ms response), corre 5-15 min en background.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: midocean-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar midocean-sync
        env:
          CRON_SECRET: ${{ secrets.MERCH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta secret MERCH_CRON_SECRET"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://merchandising.hubstartidea.es/api/cron/midocean-sync" \
            -H "x-cron-secret: $CRON_SECRET")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            echo "::error::midocean-sync devolvió $code"
            exit 1
          fi
