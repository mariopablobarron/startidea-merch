name: MidOcean sync diario

# Diario 01:30 UTC. Sync productos + stock + precios MidOcean → BD.
# Fire-and-forget en el endpoint (200ms response), corre 5-15 min en background.

# El disparo diario lo hace el crontab del VPS (merch-cron-runner.sh, 04:00
# hora Madrid = 02:00 UTC), más robusto (guardas de arranque/carga/docker +
# Telegram solo en fallo real). Se retiró el schedule de GitHub Actions para no
# duplicar el sync ni chocar con el crontab (409 del cron-lock). Queda
# workflow_dispatch para lanzarlo a mano.
on:
  workflow_dispatch: {}

concurrency:
  group: midocean-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar midocean-sync
        uses: ./.github/actions/cron-trigger
        with:
          name: midocean-sync
          url: https://merchandising.startidea.es/api/cron/midocean-sync
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200 202"
