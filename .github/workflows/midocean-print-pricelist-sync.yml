name: MidOcean print pricelist sync

# Semanal lunes 02:00 UTC. Sincroniza tarifas de marcaje MidOcean.
# Cambian poco — semanal es suficiente.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

concurrency:
  group: midocean-print-pricelist-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar midocean-print-pricelist-sync
        env:
          CRON_SECRET: ${{ secrets.MERCH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta secret MERCH_CRON_SECRET"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://merchandising.hubstartidea.es/api/cron/midocean-print-pricelist-sync" \
            -H "x-cron-secret: $CRON_SECRET")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            echo "::error::midocean-print-pricelist-sync devolvió $code"
            exit 1
          fi
