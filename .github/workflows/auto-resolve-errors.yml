name: Auto-resolve errors stale

# 04:15 UTC todos los días. (El metric-snapshot y el rollup a los que aludía
# esta línea ya no los programa GitHub: desde el 2026-09-01 los dispara el
# crontab del VPS a las 06:40 y 06:50 locales = 04:40 y 04:50 UTC.)
# Cierra automáticamente errores con >30 días sin ocurrencias nuevas.
# Idempotente: si no hay nada que cerrar, devuelve groupsClosed=0.

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: auto-resolve-errors
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar auto-resolve
        uses: ./.github/actions/cron-trigger
        with:
          name: auto-resolve-errors
          url: https://merchandising.startidea.es/api/cron/auto-resolve-errors
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
