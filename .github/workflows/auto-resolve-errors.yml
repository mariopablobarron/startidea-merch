name: Auto-resolve errors stale

# 04:15 UTC todos los días (después de metric-snapshot 03:35 y rollup 03:00).
# Cierra automáticamente errores con >30 días sin ocurrencias nuevas.
# Idempotente: si no hay nada que cerrar, devuelve groupsClosed=0.

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: auto-resolve-errors
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar auto-resolve
        env:
          CRON_SECRET: ${{ secrets.MERCH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta secret MERCH_CRON_SECRET"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://merchandising.hubstartidea.es/api/cron/auto-resolve-errors" \
            -H "x-cron-secret: $CRON_SECRET")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::auto-resolve devolvió $status"
            exit 1
          fi
