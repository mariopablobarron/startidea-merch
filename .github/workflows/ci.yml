name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Relanzar CI a mano. Sin esto, la única forma de reintentar un run atascado
  # era gastar un push entero: el 26-ago-2026 dos runs se quedaron encolados
  # 50 min por una caída de GitHub Actions y no había manera de repetirlos.
  workflow_dispatch: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      payments-test-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: merch_cto_payments_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d merch_cto_payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Payment transactions against disposable PostgreSQL
        run: |
          pnpm prisma db push --skip-generate
          pnpm vitest run --config vitest.payments-integration.config.ts
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/merch_cto_payments_test?schema=public
          PAYMENT_INTEGRATION_TEST: "1"

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
