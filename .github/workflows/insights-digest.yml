name: Insights weekly digest

# Lunes 08:00 UTC (10:00 Madrid en verano CEST, 09:00 invierno CET).
# Manda email al admin con KPIs + sugerencias + top productos.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

concurrency:
  group: insights-digest
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Disparar digest
        uses: ./.github/actions/cron-trigger
        with:
          name: insights-digest
          url: https://merchandising.startidea.es/api/cron/insights-digest
          secret: ${{ secrets.MERCH_CRON_SECRET }}
          accept: "200"
